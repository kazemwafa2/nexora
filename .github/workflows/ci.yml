name: Nexora Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          command -v aapt2
          command -v apksigner
          command -v zipalign

      - name: Build and test core
        run: sh tools/build_core.sh

      - name: Build APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export TARGET_SDK=35
          test -f "$ANDROID_JAR"
          sh tools/build_apk_termux.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk
          path: build/apk-35/nexora-debug.apk
          if-no-files-found: error
          retention-days: 7
